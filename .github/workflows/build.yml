name: Build Voidverse

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q voidverse-mod.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        working-directory: voidverse-mod
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: voidverse-jar
          path: voidverse-mod/build/libs/voidverse-1.0.0.jar
